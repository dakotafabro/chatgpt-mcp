[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-mcp"
version = "0.1.0"
description = "MCP server for reading shared ChatGPT conversations into Goose"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
chatgpt-mcp = "chatgpt_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_mcp"]
